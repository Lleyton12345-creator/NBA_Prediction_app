name: Enrich NBA player biographies
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/enrich-player-bios.yml'
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - run: python enrich_player_bios.py
      - name: Save verified enrichment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/player_bios.json data/bio_coverage_report.json
          git diff --cached --quiet || (git commit -m "Enrich NBA player bios from external directory" && git push)
